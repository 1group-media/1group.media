server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /api/health {
        return 200 '{"status":"healthy","service":"1group.media"}';
        add_header Content-Type application/json;
    }
}
